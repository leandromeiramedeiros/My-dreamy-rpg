<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreamy Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120a24; --panel: #1c1236; --panel2: #251a45; --line: #3d2f6b; --text: #f4ecff; --dim: #a99cc8;
      --accent: #c7a8ff; --gold: #ffd35a; --pink: #ffb0e0; --blue: #8fb0ff; --bad: #ff6b8a; --good: #8fe0a0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Nunito, system-ui, sans-serif; overflow: hidden; }
    button, select, input, textarea { font: inherit; color: var(--text); }
    button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
    button:hover { border-color: var(--accent); }
    button.on { background: #4a3480; border-color: var(--gold); }
    button.primary { background: #5a3fa8; border-color: var(--accent); font-weight: 800; }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    select, input, textarea { background: #0e0820; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
    input[type=number] { width: 70px; }
    input[type=checkbox] { accent-color: var(--accent); }
    label { color: var(--dim); }
    h3 { font: 10px "Press Start 2P", monospace; color: var(--gold); margin: 14px 0 8px; letter-spacing: 1px; }
    #app { display: grid; grid-template-rows: 46px 1fr 26px; grid-template-columns: 390px 1fr; height: 100%; }
    #top { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
    #top .logo { font: 11px "Press Start 2P", monospace; color: var(--pink); margin-right: 8px; white-space: nowrap; }
    #top .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
    #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    #tabs { display: flex; border-bottom: 1px solid var(--line); }
    #tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px; font: 9px "Press Start 2P", monospace; color: var(--dim); }
    #tabs button.on { color: var(--gold); background: var(--panel2); box-shadow: inset 0 -2px var(--gold); }
    #panel { overflow-y: auto; padding: 4px 12px 40px; flex: 1; }
    #view { position: relative; min-width: 0; min-height: 0; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: pixelated; }
    #status { grid-column: 1 / 3; display: flex; gap: 18px; align-items: center; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
    #status b { color: var(--text); font-weight: 600; }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tools button { padding: 7px 4px; font-size: 12px; }
    .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .sw { display: flex; align-items: center; gap: 6px; padding: 4px; font-size: 12px; }
    .sw i { width: 18px; height: 18px; border-radius: 3px; flex: none; border: 1px solid #0006; }
    .objs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .obj { padding: 4px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; font-size: 10px; color: var(--dim); }
    .obj canvas { image-rendering: pixelated; max-height: 44px; }
    .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
    .row > label:first-child { min-width: 64px; }
    .hint { color: var(--dim); font-size: 12px; margin: 6px 0; }
    .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 10px 0; }
    .card.off { opacity: .55; }
    .card .head { display: flex; gap: 6px; align-items: center; }
    .card .head input.name { flex: 1; font-weight: 800; }
    .card .sum { color: var(--pink); font-size: 12px; margin: 6px 0; }
    .tag { font: 8px "Press Start 2P", monospace; padding: 3px 5px; border-radius: 4px; }
    .tag.when { background: #2e4a8a; color: #cfe0ff; } .tag.then { background: #6a2f5c; color: #ffd6ec; } .tag.req { background: #3d4a2f; color: #d8f0b8; }
    .act { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; background: #0e082088; border-radius: 6px; padding: 5px; margin: 4px 0; }
    .act select:first-of-type { font-weight: 700; }
    .act input { width: 60px; } .act input.wide { width: 170px; }
    .mini { padding: 2px 6px; font-size: 11px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td, th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--dim); font-weight: 600; }
    td input { width: 58px; }
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 10px; padding: 16px 18px; max-width: 520px; width: 92vw; }
    dialog::backdrop { background: #0008; }
    dialog h2 { font: 12px "Press Start 2P", monospace; color: var(--gold); margin: 0 0 12px; }
    dialog .row > label:first-child { min-width: 110px; }
    dialog input[type=text], dialog input[type=password] { flex: 1; min-width: 180px; }
    .warn { color: var(--bad); } .ok { color: var(--good); }
    #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; display: none; z-index: 10; max-width: 80vw; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); font: 12px "Press Start 2P", monospace; color: var(--pink); z-index: 20; }
    a { color: var(--accent); }
    #tabs button { font-size: 8px; padding: 10px 4px; }
    .elist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .elist button { height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; padding: 4px; }
    .elist canvas { image-rendering: pixelated; max-height: 50px; max-width: 56px; }
    .stats td:first-child { color: var(--dim); }
    .stats input[type=number] { width: 80px; }
    .stats input[type=text] { width: 200px; }
    dialog.wide { max-width: 980px; width: 96vw; }
    .px { display: grid; grid-template-columns: auto 230px; gap: 16px; }
    .px canvas.grid { image-rendering: pixelated; cursor: crosshair; touch-action: none; border: 1px solid var(--line); background: #0a0614; }
    .pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .pal button { height: 28px; padding: 0; border-width: 2px; }
    .pal button.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .pal button.clear { background: repeating-conic-gradient(#3a3050 0 25%, #1c1236 0 50%) 0 0 / 10px 10px; }
    .prev { display: flex; gap: 10px; align-items: flex-end; background: repeating-conic-gradient(#2a2042 0 25%, #1c1236 0 50%) 0 0 / 12px 12px; padding: 8px; border-radius: 6px; min-height: 60px; }
    .prev canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">DREAMY EDITOR</span>
    <select id="mapSel" title="Map being edited"></select>
    <button id="bNew" title="Create a new map">+ New map</button>
    <button id="bSettings" title="Name, theme, size, objective">Map settings</button>
    <span class="sep"></span>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="bGrid" title="Toggle grid (G)">Grid</button>
    <span class="sep"></span>
    <button id="bPlay" class="primary" title="Play this map in a new tab">▶ Play-test</button>
    <button id="bExport" title="Download world.json">Export</button>
    <button id="bImport" title="Load a world.json">Import</button>
    <button id="bRevert" title="Throw away the draft and reload the published world">Reset to published</button>
    <span class="sep"></span>
    <button id="bPublish" class="primary" title="Commit to GitHub — updates the live game">⬆ Publish</button>
    <button id="bGh" title="GitHub token & repository">GitHub settings</button>
  </div>
  <div id="side">
    <div id="tabs"><button data-tab="map" class="on">MAP</button><button data-tab="logic">LOGIC</button><button data-tab="enemies">ENEMIES</button><button data-tab="tune">TUNING</button></div>
    <div id="panel"></div>
  </div>
  <div id="view"><canvas id="cv"></canvas></div>
  <div id="status"><span id="stTile">—</span><span id="stTool"></span><span id="stHint"></span><span style="flex:1"></span><span id="stSave"></span></div>
</div>
<div id="toast"></div>
<div id="loading">loading editor…</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<dialog id="dlg"></dialog>

<script src="js/util.js"></script>
<script src="js/settings.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/enemyart.js"></script>
<script src="js/data.js"></script>
<script src="js/items.js"></script>
<script src="js/itemdata.js"></script>
<script src="js/world.js"></script>
<script src="js/enemydata.js"></script>
<script src="js/parts.js"></script>
<script src="js/bosses.js"></script>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
<script src="js/font.js"></script>
<script src="js/ui.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
