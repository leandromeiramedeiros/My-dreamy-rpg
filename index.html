<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0614">
  <title>My Dreamy RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0614; overflow: hidden; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd6ec; font: 14px "Press Start 2P", monospace; letter-spacing: 2px; background: #0a0614; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">dreaming…</div>
  <!-- classic scripts (not modules) so index.html also works straight from file:// -->
  <script src="js/util.js"></script>
  <script src="js/elfx.js"></script>
<script src="js/wind.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/art.js"></script>
  <script src="js/enemyart.js"></script>
  <script src="js/parts-art.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/forge-rt.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/items.js"></script>
  <script src="js/itemdata.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/world.js"></script>
  <script src="js/arenas.js"></script>
  <script src="js/enemydata.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/sfxdata.js"></script>
  <script src="js/music.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/status.js"></script>
  <script src="js/font.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/art-raster.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/input.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
