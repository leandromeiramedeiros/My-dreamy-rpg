<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dreamy RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0614; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd6ec; font: 14px "Press Start 2P", monospace; letter-spacing: 2px; background: #0a0614; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">dreaming…</div>
  <!-- classic scripts (not modules) so index.html also works straight from file:// -->
  <script src="js/util.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
