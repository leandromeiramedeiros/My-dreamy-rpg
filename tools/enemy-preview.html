<!doctype html>
<html><head><meta charset="utf-8"><title>Enemy preview</title>
<style>
 body{margin:0;background:#15121e;color:#cfc8e8;font:12px/1.4 monospace}
 h1{margin:12px;font-size:14px;color:#ffd870}
 section{margin:0 0 6px;padding:6px 0;background:#181526}
 h2{margin:6px 12px;font-size:13px;color:#ffd870}
 canvas{display:block;image-rendering:pixelated;margin:4px 12px}
</style></head><body>
<h1>ENEMY_ART preview &mdash; 4x, hero (24x34) shown for scale; ground line = sprite foot anchor</h1>
<div id="root"></div>
<script src="../js/util.js"></script>
<script src="../js/hero.js"></script>
<script src="../js/enemyart.js"></script>
<script>
'use strict';
const SC = 4, BG = '#26223a', TXT = '#cfc8e8', GROUND = '#3a3458';
const q = new URLSearchParams(location.search), only = q.get('only');
let hero = null;
try { hero = HERO.build({}).front[0]; } catch (e) { console.warn('hero unavailable', e); }

function label(x, s, px, py, col) { x.fillStyle = col || TXT; x.font = '11px monospace'; x.fillText(s, px, py); }
// one canvas per anim row: frames side by side at 4x, optional hero at the left for scale
function row(sec, key, anim, opts) {
  const info = ENEMY_ART.info[key], n = info.anims[anim], pad = 8, lab = 16;
  const cw = info.w * SC + pad, hw = hero ? 24 * SC + pad : 0;
  const c = document.createElement('canvas'); c.width = hw + n * cw + pad; c.height = info.h * SC + lab + pad;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = BG; x.fillRect(0, 0, c.width, c.height);
  const gy = lab + info.ay * SC;
  x.fillStyle = GROUND; x.fillRect(0, gy, c.width, 1);
  label(x, key + ' / ' + anim + ' x' + n + (opts && opts.tint ? '  (elite tint+aura ' + opts.tint + ')' : ''), 6, 12, '#ffd870');
  if (hero) x.drawImage(hero, 0, 0, hero.width, hero.height, pad, gy - hero.height * SC + 2 * SC, hero.width * SC, hero.height * SC);
  for (let f = 0; f < n; f++) {
    const px = hw + pad + f * cw, py = lab;
    if (opts && opts.tint) { const a = ENEMY_ART.aura(key, anim, f, opts.tint, 2); x.globalAlpha = 0.8; x.drawImage(a, 0, 0, a.width, a.height, px - 2 * SC, py - 2 * SC, a.width * SC, a.height * SC); x.globalAlpha = 1; }
    const s = ENEMY_ART.get(key, anim, f, opts);
    x.drawImage(s, 0, 0, s.width, s.height, px, py, s.width * SC, s.height * SC);
    label(x, 'f' + f, px + 2, py + info.h * SC - 2, '#6a6490');
  }
  c.style.width = c.width + 'px'; c.style.height = c.height + 'px';
  sec.appendChild(c);
}
const root = document.getElementById('root');
for (const key of ENEMY_ART.keys) {
  if (only && only !== key) continue;
  const info = ENEMY_ART.info[key], sec = document.createElement('section');
  sec.id = key;
  const h = document.createElement('h2'); h.textContent = info.label + '  (' + key + ', ~' + info.scale + 'x hero, ' + info.w + 'x' + info.h + ' frame)'; sec.appendChild(h);
  for (const anim of Object.keys(info.anims)) row(sec, key, anim);
  row(sec, key, 'idle', { tint: '#ff4a6a' });   // elite hook demo: tint + aura
  root.appendChild(sec);
}
document.title = 'Enemy preview';
window.__ready = true;
</script>
</body></html>
