<!doctype html>
<html><head><meta charset="utf-8"><title>Icon preview</title>
<style>
body{background:#120c1c;color:#d8d0ec;font:12px monospace;margin:12px}
h2{margin:14px 0 6px;font-size:13px;color:#ffd77a;border-bottom:1px solid #2c2244}
.row{display:flex;flex-wrap:wrap;gap:8px}
.c{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center;font-size:10px}
canvas{image-rendering:pixelated;background:#0a0612}
</style></head><body>
<h1 style="font-size:15px;margin:0">Icon sheet (3x)</h1>
<div id="out"></div>
<script src="../js/util.js"></script>
<script src="../js/icons.js"></script>
<script>
const out = document.getElementById('out'), S = 3, W = 24 * S;
const anim = [];
function group(title) { const h = document.createElement('h2'); h.textContent = title; out.appendChild(h); const r = document.createElement('div'); r.className = 'row'; out.appendChild(r); return r; }
function cell(row, label, src, fn) {
  const d = document.createElement('div'); d.className = 'c';
  const c = document.createElement('canvas'); c.width = c.height = W; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const draw = (t) => { x.clearRect(0, 0, W, W); fn ? fn(x, t) : x.drawImage(src, 0, 0, W, W); };
  draw(0); if (fn) anim.push(draw);
  d.appendChild(c); d.appendChild(document.createTextNode(label)); row.appendChild(d);
}
const EL = ICONS.elementOf, ELS = ['fire', 'frost', 'nature', 'lightning', 'arcane', 'physical', 'holy'];
let r = group('Skills by element (' + Object.keys(EL).length + ')');
for (const el of ELS) for (const id of Object.keys(EL).filter((k) => EL[k] === el)) cell(r, id + '\n' + el, ICONS.skill(id));
const fam = [['sword', 'dawnblade'], ['staff', 'starfall'], ['bow', 'moonbow'], ['helm', 'knighthelm'], ['helm', 'arcanecowl'], ['helm', 'wardenhood'],
  ['chest', 'knightplate'], ['chest', 'dreamrobe'], ['chest', 'stalkerjacket'], ['boots', 'knightgreaves'], ['boots', 'clothsandals'], ['boots', 'stalkershoes']];
const RAR = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
for (const [k, b] of fam) { r = group('Items: ' + b + ' tiers 0-4 (rarity common/uncommon/rare/epic/legendary)'); for (let t = 0; t < 5; t++) cell(r, b + ' T' + t, ICONS.item(b, t, RAR[t], t > 1 ? ['ruby_1', 'sapphire_2', null].slice(0, t - 1) : [])); }
r = group('Trinkets: ring / amulet / belt x tier 1-3 (rarity uncommon..epic by tier)');
const TB = ICONS.trinketIds; TB.forEach((id, i) => cell(r, id.replace(/_/g, ' '), ICONS.item(id, 0, RAR[1 + i % 3], i % 3 === 0 ? [] : ['ruby_1'])));
r = group('Ring / amulet element tint (tier 3, epic): fire frost nature lightning arcane physical holy');
for (const k of ['ring', 'amulet']) for (const e of ['fire', 'frost', 'nature', 'lightning', 'arcane', 'physical', 'holy']) cell(r, k + '\n' + e, ICONS.item(k, 3, 'epic', [], { element: e }));
r = group('Tier-1 rings with element tint + tempered / implicit-element dot (right: plain vs tempered vs implicit vs both)');
for (const e of ['fire', 'frost', 'nature']) cell(r, 'T1 ' + e, ICONS.item('ring', 1, 'rare', [], { element: e }));
cell(r, 'plain', ICONS.item('dawnblade', 3, 'rare')); cell(r, 'tempered', ICONS.item('dawnblade', 3, 'rare', [], { tempered: true }));
cell(r, 'implicit fire', ICONS.item('dawnblade', 3, 'rare', [], { implicit: 'fire' })); cell(r, 'both', ICONS.item('dawnblade', 3, 'rare', [], { implicit: 'frost', tempered: true }));
cell(r, 'belt T3 tempered', ICONS.item('moonlit_girdle', 3, 'legendary', ['ruby_2'], { tempered: true, implicit: 'arcane' }));
r = group('Uniques: trinket (pips lantern .. quiet girdle) + world (comet band .. hollow bell), legendary frame');
for (const id of ICONS.uniqueIds) cell(r, id, ICONS.item(id, 3, 'legendary', id.includes('lantern') || id.includes('compass') ? ['topaz_1'] : []));
r = group('Gems: 6 types x 3 grades (chipped, clear, radiant)');
for (const g of ['ruby', 'sapphire', 'emerald', 'topaz', 'amethyst', 'diamond']) for (let k = 0; k < 3; k++) cell(r, g + ' ' + k, ICONS.gem(g, k));
r = group('Misc');
for (const m of ['potion', 'dust', 'rune', 'chest', 'xp', 'key', 'choice', 'shrine', 'tablet', 'gold']) cell(r, m, ICONS.misc(m));
r = group('Rarity frames (animated) over tier-4 sword');
for (const q of RAR) cell(r, q, null, (x, t) => { x.drawImage(ICONS.item('dawnblade', 4, 'common'), 0, 0, W, W); ICONS.frame(x, 0, 0, W, q, t); });
r = group('Old glyph names -> ICONS.glyph');
for (const g of ['sword', 'staff', 'bow', 'helm', 'chest', 'boots', 'heart', 'fire', 'frost', 'shield', 'star', 'arc', 'nova', 'surge']) cell(r, g, ICONS.glyph(g));
const t0 = performance.now(); (function loop() { const t = (performance.now() - t0) / 1000; for (const f of anim) f(t); requestAnimationFrame(loop); })();
</script></body></html>
